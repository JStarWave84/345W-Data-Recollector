[package]
name = "data-recollection-ftr"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "data_recollection_ftr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-geolocation = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `embedded_images` habilita `Image` en printpdf, que es lo que dibuja el logo
# de la fundacion en la planilla. Sin esta feature el logo no se podria meter.
printpdf = { version = "0.7", features = ["embedded_images"] }
# El mismo `image` que usa printpdf por dentro, renombrado porque printpdf
# reexporta un modulo llamado `image` y si no los dos chocan. Se declara aca
# porque el codigo de la planilla redimensiona el logo antes de incrustarlo: el
# PNG original pesa 447 KB y a 14mm de alto sale en un quinto de eso.
img = { package = "image", version = "0.24", default-features = false, features = ["png"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
